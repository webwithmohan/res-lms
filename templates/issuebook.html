<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issue Book</title>
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/variable.css" />
  <link rel="stylesheet" href="../css/issue.css">
</head>

<body>
  <aside></aside>

  <!--Main Content-->
  <main>
    <h1 class="page-title">Issue a Book</h1>
    <p class="page-subtitle">Assign a book to a member and set its return date.</p>
    <div class="issue-book-container">
      <section class="left-issue">
          <div class="issue-card-header">
            <span class="material-symbols-outlined">assignment_add</span>
            <div>
              <h2>New book issue</h2>
              <p>Complete the details below to record an issue.</p>
            </div>
          </div>
          <div class="section">
            <div class="input-group">
              <label for="memberSelect">Select member <span>*</span></label>
              <select id="memberSelect">
                <option value="">Choose a member</option>
              </select>
            </div>
            <div class="input-group">
              <label for="bookSelect">Select book <span>*</span></label>
              <select id="bookSelect">
                <option value="">Choose an available book</option>
              </select>
            </div>
            <div class="date-fields">
              <div class="date">
                <label for="issueDate">Issue date <span>*</span></label>
                <input type="date" id="issueDate" />
              </div>
              <div class="due">
                <label for="dueDate">Return / due date <span>*</span></label>
                <input type="date" id="dueDate" />
              </div>
            </div>
            <div class="btn-group">
              <button class="issue-submit" id="issueBtn" type="button">Issue book</button>
              <button class="issue-clear" id="clearBtn" type="button">Clear fields</button>
            </div>
          </div>
      </section>
      <!-- <div class="right-issue" style="margin-left: 30px; border: 2px solid rgb(212, 209, 209); border-radius: 10px">
        <div class="right-text" style="background-color: rgb(210, 208, 208); padding: 10px 5px; border-radius: 8px;">
          <h2>Issue Workflow Architecture</h2>

        </div>
        <div class="right-content" style="padding: 10px;">
          <ol style="list-style: none;" class="avail-list">
            <li>Availability Check</li>
            <li>Stock Management</li>
            <li>Transaction logging</li>
          </ol>

        </div>
      </div> -->
    </div>
    <div class="wrapper">
      <div class="card-track">
       

      </div>
    </div>
  </main>

  <script src="../js/sidebar.js"></script>
  <script src="../js/dashboard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/issue.js"></script>

</body>

</html>
