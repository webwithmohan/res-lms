<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Books</title>
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/variable.css" />
    <link rel="stylesheet" href="../css/books.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>

  <body>
    <aside></aside>

    <!--Main Content-->
    <main>
      <div class="container">
        <h1 style="display: flex;
        align-items: center;">
          Books <span class="material-symbols-outlined" style="font-size: 40px; text-align: center;align-content: center; margin-left: 20px;color: var(--main-color);"> auto_stories </span>
        </h1>
        <div class="category-link">
          <li class="active" data-category="all">All</li>
        </div>
        <div
          class="search"
          style="
            display: flex;
            background-color: gray;
            width: 300px;
            align-items: center;
            height: 40px;
            margin: 10px 0px;
            border: 1px solid rgb(176, 173, 173);
            border-radius: 12px;
          "
        >
          <div
            style="
              background-color: var(--main-color);
              display: flex;
              justify-content: center;
              align-items: center;
              width: 15%;
              height: 100%;
              border-radius: 10px 0px 0px 10px;
            "
          >
            <span class="search-icon material-symbols-outlined"> search </span>
          </div>
          <div style="width: 100%; height: 100%">
            <input
              type="text"
              style="
                width: 100%;
                height: 100%;
                border: none;
                outline: none;
                padding-left: 20px;
                border-radius: 0px 10px 10px 0px;
              "
              placeholder="Search by name,author...."
              id="searchBook"
            />
          </div>
        </div>
         <div class="wrapper">
    

    <div class="table-container">
      <table class="book-table">
        <thead>
          <tr>
            <th>Book Id</th>
            <th>Book Name &amp; Details</th>
            <th>Author</th>
            <th>Category</th>
            <th class="qty-col">Quantity</th>
            <th class="action-col">Action</th>
          </tr>
        </thead>
        <tbody>
          
        </tbody>
      </table>
    </div>
  </div>
        
      </div>
      <button
        style="
          position: absolute;
          top: 20px;
          right: 30px;
          padding: 10px 10px;
          border-radius: 12px;
          border: none;
          outline: none;
          background-color: var(--main-color);
          color: white;
          font-size: 15px;
          display: flex;
          justify-content: center;
          align-items: center;
        "
        onclick="openBookPopup()"
      >
        <span
          class="add-icon material-symbols-outlined"
          style="align-content: center; place-items: center"
        >
          add </span
        >Add Book
      </button>
      <div
        class="overlay"
        style="
          width: 100%;
          height: 100%;
          background-color: rgba(0, 0, 0, 0.8);
          position: absolute;
          left: 0;
          top: 0;
        "
      >
        <div class="popup" style="background-color: white">
          <h1 style="text-align: center; color: var(--main-color)">Add Book</h1>
          <div class="input-group">
            <label for="">Book ID <span style="color: red">*</span></label>
            <input type="text" id="bookId" readonly />
          </div>
          <div class="input-group">
            <label for="">Book Title</label>
            <input type="text" id="bookTitle" placeholder="e.g Python" />
          </div>
          <div class="input-group">
            <label for="">Book Author</label>
            <input type="text" id="bookAuthor" placeholder="e.g Remo" />
          </div>
          <div class="input-group" style="display: flex; gap: 20px">
            <div style="width: 100%">
              <label for="">Book Category</label>
              <select
                name=""
                id="bookCategory"
                style="width: 100%; height: 40px"
              ></select>
            </div>
            <div style="width: 100%">
              <label for="">Book Quantity</label>
              <input
               type="text"
                placeholder="e.g 2"
                id="bookQuantity"
                style="width: 100%"
                inputmode="numeric"
               
              />
            </div>
            <div></div>
          </div>
          <div
            class="input-group"
            style="display: flex; gap: 20px; justify-content: space-between"
          >
            <div style="width: 100%">
              <label for="">Publisher</label>
              <input
                type="text"
                name=""
                id="bookPublisher"
                placeholder="e.g Martin"
                
              />
            </div>
            <div style="width: 100%">
              <label for="">Year</label>
              <input type="text" name="" id="bookYear" placeholder="e.g 1965" inputmode="numeric"/>
            </div>
          </div>
          <div class="btn-group">
            <button class="cancel-btn" onclick="closePopup()">Cancel</button>
            <button class="save-btn" onclick="addBook()">Save</button>
          </div>
        </div>
      </div>

      <!-- edit overlay -->
      <div
        class="editOverlay"
        style="
          width: 100%;
          height: 100%;
          background-color: rgba(0, 0, 0, 0.8);
          position: absolute;
          left: 0;
          top: 0;
        "
      >
        <div class="popup" style="background-color: white">
          <h1 style="text-align: center; color: var(--main-color)">
            Edit Book
          </h1>
          <div class="input-group">
            <label for="">Book ID <span style="color: red">*</span></label>
            <input type="text" id="editBookId" readonly />
          </div>
          <div class="input-group">
            <label for="">Book Title</label>
            <input type="text" id="editBookTitle" placeholder="e.g Python" />
          </div>
          <div class="input-group">
            <label for="">Book Author</label>
            <input type="text" id="editBookAuthor" placeholder="e.g Remo" />
          </div>
          <div class="input-group" style="display: flex; gap: 20px">
            <div style="width: 100%">
              <label for="">Book Category</label>
              <select
                name=""
                id="editBookCategory"
                style="width: 100%; height: 40px"
              >
                <option value="tech">Tech</option>
                <option value="science">Science</option>
                <option value="programming">Programming</option>
                <option value="history">History</option>
                <option value="physics">Physics</option>
              </select>
            </div>
            <div style="width: 100%">
              <label for="">Book Quantity</label>
              <input
                type="text"
                placeholder="e.g 2"
                id="editBookQuantity"
                style="width: 100%"
              />
            </div>
            <div></div>
          </div>
          <div
            class="input-group"
            style="display: flex; gap: 20px; justify-content: space-between"
          >
            <div style="width: 100%">
              <label for="">Publisher</label>
              <input
                type="text"
                name=""
                id="editBookPublisher"
                placeholder="e.g Martin"
              />
            </div>
            <div style="width: 100%">
              <label for="">Year</label>
              <input
                type="text"
                name=""
                id="editBookYear"
                placeholder="e.g 1965"
              />
            </div>
          </div>
          <div class="btn-group">
            <button class="cancel-btn" onclick="editOverlay()">Cancel</button>
            <button class="save-btn" onclick="editBook()">Edit</button>
          </div>
        </div>
      </div>

      <!-- -------------- -->
    </main>
    <!-- <script src="/popup/addbook/popup.js"></script> -->
    <script src="../js/sidebar.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/books.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  </body>
</html>
